{% extends "base.html" %}
{% block title %}{{ page_title }} · Sands-sorter{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">{{ page_title }}</h1>

<section class="bg-white rounded-lg shadow p-6 mb-6">
  <form method="post" action="{{ route_path }}" class="flex gap-3 items-end">
    <label class="flex-1">
      <span class="block text-sm text-slate-600">Name</span>
      <input name="name" required class="w-full border rounded px-2 py-1">
    </label>
    <label class="flex-1">
      <span class="block text-sm text-slate-600">Drive folder ID (optional)</span>
      <input name="drive_folder_id" class="w-full border rounded px-2 py-1">
    </label>
    <button class="bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700">Add</button>
  </form>
</section>

<section class="bg-white rounded-lg shadow p-6">
  {% if scopes %}
    <ul class="divide-y">
      {% for s in scopes %}
        <li class="py-2 flex items-center justify-between">
          <span>{{ s.name }}</span>
          <form method="post" action="{{ route_path }}/{{ s.id }}/delete">
            <button class="text-sm text-red-600 hover:underline">delete</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-slate-500">No {{ page_title|lower }} yet.</p>
  {% endif %}
</section>
{% endblock %}
