{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Manual upload</h1>

<section class="bg-white rounded-lg shadow p-6 max-w-xl">
  <p class="text-sm text-slate-600 mb-4">
    Pick a scope (Property, Car, or Life) and a category. Files land at
    <code>Properties/&lt;Name&gt;/&lt;Cat&gt;/&lt;Year&gt;/</code>,
    <code>Cars/&lt;Name&gt;/&lt;Cat&gt;/&lt;Year&gt;/</code>, or
    <code>Life/&lt;Cat&gt;/&lt;Year&gt;/</code>.
  </p>
  <form method="post" enctype="multipart/form-data" action="/upload" class="grid gap-3">
    <label>
      <span class="block text-sm text-slate-600">Scope</span>
      <select name="scope_id" required class="w-full border rounded px-2 py-1">
        {% set last_kind = namespace(value=None) %}
        {% for s in scopes %}
          {% if s.kind != last_kind.value %}
            {% if last_kind.value is not none %}</optgroup>{% endif %}
            <optgroup label="{{ s.kind.value|capitalize }}">
            {% set last_kind.value = s.kind %}
          {% endif %}
          <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
        {% if last_kind.value is not none %}</optgroup>{% endif %}
      </select>
    </label>
    <label>
      <span class="block text-sm text-slate-600">Category</span>
      <select name="category_id" required class="w-full border rounded px-2 py-1">
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span class="block text-sm text-slate-600">Year (optional, defaults to current)</span>
      <input name="year" type="number" min="1900" max="2100" class="w-full border rounded px-2 py-1">
    </label>
    <label>
      <span class="block text-sm text-slate-600">File</span>
      <input name="file" type="file" required class="w-full">
    </label>
    <button class="bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 w-fit">
      Upload
    </button>
  </form>
</section>
{% endblock %}
