<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sands-sorter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold">Sands-sorter</a>
      <nav class="flex gap-4 text-sm">
        {% if user_email %}
          <a href="/" class="hover:underline">Dashboard</a>
          <a href="/import" class="hover:underline">Import</a>
          <a href="/moves" class="hover:underline">Moves</a>
          <a href="/rules" class="hover:underline">Rules</a>
          <a href="/properties" class="hover:underline">Properties</a>
          <a href="/entities" class="hover:underline">Entities</a>
          <a href="/personal" class="hover:underline">Personal</a>
          <a href="/categories" class="hover:underline">Categories</a>
          <a href="/upload" class="hover:underline">Upload</a>
          <span class="text-slate-500">{{ user_email }}</span>
          <a href="/auth/logout" class="text-slate-500 hover:underline">Sign out</a>
        {% else %}
          <a href="/auth/login" class="text-blue-600 hover:underline">Sign in</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
